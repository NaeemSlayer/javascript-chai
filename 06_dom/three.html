<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM | Chai aur code</title>
  </head>
  <body style="background-color: #211212; color: #fff"></body>
  <script>
    // Create a new <div> element
    const div = document.createElement("div");

    // Log the div to the console for debugging
    console.log(div);

    // Set the class name of the div to "main"
    div.className = "main";

    // Set a random id between 1 and 11
    div.id = Math.round(Math.random() * 10 + 1);

    // Set the title attribute of the div
    div.setAttribute("title", "generated title");

    // Set background color and padding using inline styles
    div.style.backgroundColor = "green";
    div.style.padding = "10px";

    // Create a text node with the content "Chai aur Code"
    const addText = document.createTextNode("Chai aur Code");

    // Append the text node to the div
    div.appendChild(addText);

    // Append the complete div to the body of the document
    document.body.appendChild(div);
  </script>
</html>
